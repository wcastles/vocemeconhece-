<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quem me conhece mais? 💙</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         TELA INICIAL
    ========================== -->

    <main id="start-screen" class="screen active">

        <div class="start-card">

            <div class="decoration decoration-one">✦</div>
            <div class="decoration decoration-two">✧</div>

            <p class="mini-title">UM QUIZ SOBRE MIM</p>

            <h1>
                Quem me<br>
                <span>conhece mais?</span>
            </h1>

            <p class="description">
                Vamos descobrir o quanto você realmente me conhece...
            </p>

            <div class="name-box">

                <label for="player-name">
                    Antes de começar, coloque seu nome:
                </label>

                <input
                    type="text"
                    id="player-name"
                    placeholder="Digite seu nome..."
                    maxlength="30"
                    autocomplete="off"
                >

            </div>

            <button id="start-button" class="main-button">
                COMEÇAR QUIZ
                <span>→</span>
            </button>

        </div>

    </main>


    <!-- =========================
         TELA DO QUIZ
    ========================== -->

    <main id="quiz-screen" class="screen">

        <div class="quiz-container">

            <header class="quiz-header">

                <div>
                    <p class="quiz-label">
                        QUEM ME CONHECE MAIS?
                    </p>

                    <h2 id="question-number">
                        Pergunta 1
                    </h2>
                </div>

                <div class="score">

                    <span>PONTOS</span>

                    <strong id="score">
                        0
                    </strong>

                </div>

            </header>


            <!-- PROGRESSO -->

            <div class="progress-container">

                <div class="progress-bar">

                    <div id="progress"></div>

                </div>

                <span id="progress-text">
                    1 / 14
                </span>

            </div>


            <!-- CARTÃO DA PERGUNTA -->

            <section class="question-card">

                <p id="question-text"></p>


                <!-- RESPOSTAS NORMAIS -->

                <div id="answers" class="answers"></div>


                <!-- RANKING -->

                <div id="ranking-area" class="ranking-area hidden">

                    <p class="ranking-instruction">
                        Arraste as opções e organize meus medos
                        do maior para o menor.
                    </p>

                    <div id="ranking-list"></div>

                    <button
                        id="ranking-button"
                        class="main-button"
                    >
                        CONCLUIR RANKING
                    </button>

                </div>


                <!-- FEEDBACK -->

                <div
                    id="feedback"
                    class="feedback"
                ></div>


                <!-- PRÓXIMA -->

                <button
                    id="next-button"
                    class="next-button hidden"
                >
                    PRÓXIMA →
                </button>

            </section>

        </div>

    </main>


    <!-- =========================
         TELA FINAL
    ========================== -->

    <main id="result-screen" class="screen">

        <div class="result-card">

            <div class="result-star">
                ✦
            </div>

            <p class="mini-title">
                RESULTADO
            </p>

            <h1>
                <span id="result-name">
                    Você
                </span>,
                você fez:
            </h1>

            <div class="final-score">

                <strong id="final-score">
                    0
                </strong>

                <span>
                    PONTOS
                </span>

            </div>

            <p id="result-message"></p>

            <button
                id="restart-button"
                class="main-button"
            >
                JOGAR NOVAMENTE
            </button>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
